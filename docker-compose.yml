version: '3.8'

services:
  # Monitoring Server
  monitor-server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: devops-monitor-server
    ports:
      - "8080:8080"
    volumes:
      - monitor-data:/app/data
      - ./server/config.toml:/app/config.toml:ro
    environment:
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8080
      - DATABASE_ENABLED=true
      - DATABASE_URL=sqlite:/app/data/monitoring.db
      - AUTH_ENABLED=true
      - AUTH_REQUIRE_API_KEY=false
    networks:
      - monitoring
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  # Dashboard (Next.js)
  monitor-dashboard:
    build:
      context: ./dev-ops-monitoring-dashboard
      dockerfile: Dockerfile
    container_name: devops-monitor-dashboard
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080
    networks:
      - monitoring
    depends_on:
      - monitor-server
    restart: unless-stopped

  # Example Agent - Web Server
  agent-web:
    build: ./agent
    container_name: monitor-agent-web
    environment:
      - AGENT_NAME=docker-web-01
      - SERVER_URL=http://monitor-server:8080
      - COLLECTION_INTERVAL=10
      # Uncomment and set your API key if authentication is required
      # - API_KEY=msk_your_api_key_here
    networks:
      - monitoring
    depends_on:
      - monitor-server
    restart: unless-stopped

  # Example Agent - API Server
  agent-api:
    build: ./agent
    container_name: monitor-agent-api
    environment:
      - AGENT_NAME=docker-api-01
      - SERVER_URL=http://monitor-server:8080
      - COLLECTION_INTERVAL=10
      # Uncomment and set your API key if authentication is required
      # - API_KEY=msk_your_api_key_here
    networks:
      - monitoring
    depends_on:
      - monitor-server
    restart: unless-stopped

  # Example Agent - Database Server
  agent-db:
    build: ./agent
    container_name: monitor-agent-db
    environment:
      - AGENT_NAME=docker-db-01
      - SERVER_URL=http://monitor-server:8080
      - COLLECTION_INTERVAL=10
      # Uncomment and set your API key if authentication is required
      # - API_KEY=msk_your_api_key_here
    networks:
      - monitoring
    depends_on:
      - monitor-server
    restart: unless-stopped

networks:
  monitoring:
    driver: bridge

volumes:
  monitor-data:
    driver: local
