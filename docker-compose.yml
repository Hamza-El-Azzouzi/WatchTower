services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: monitoring-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-monitoring}
      POSTGRES_USER: ${POSTGRES_USER:-monitoring_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monitoring_user -d monitoring"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - monitoring
    restart: unless-stopped

  # Monitoring Server
  monitor-server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: devops-monitor-server
    ports:
      - "8080:8080"
    volumes:
      - ./server/config.toml:/app/config.toml:ro
    environment:
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8080
      - DATABASE_URL=postgresql://${POSTGRES_USER:-monitoring_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-monitoring}
      - AUTH_ENABLED=true
      - AUTH_REQUIRE_API_KEY=true
      - ADMIN_JWT_SECRET=${ADMIN_JWT_SECRET:?Set ADMIN_JWT_SECRET in .env}
      - BOOTSTRAP_ADMIN_USERNAME=${BOOTSTRAP_ADMIN_USERNAME:-admin}
      - BOOTSTRAP_ADMIN_PASSWORD=${BOOTSTRAP_ADMIN_PASSWORD:?Set BOOTSTRAP_ADMIN_PASSWORD in .env}
      - CORS_ALLOWED_ORIGIN=${DASHBOARD_ORIGIN:-http://localhost:3000}
      - RUST_LOG=info
      - ALERT_CHECK_INTERVAL_SECONDS=${ALERT_CHECK_INTERVAL_SECONDS:-5}
      - AGENT_OFFLINE_AFTER_SECONDS=${AGENT_OFFLINE_AFTER_SECONDS:-60}
    networks:
      - monitoring
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  # Dashboard (Next.js)
  monitor-dashboard:
    build:
      context: ./dev-ops-monitoring-dashboard
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8080}
        NEXT_PUBLIC_WS_URL: ${PUBLIC_WS_URL:-ws://localhost:8080}
    container_name: devops-monitor-dashboard
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${PUBLIC_API_URL:-http://localhost:8080}
      - NEXT_PUBLIC_WS_URL=${PUBLIC_WS_URL:-ws://localhost:8080}
    networks:
      - monitoring
    depends_on:
      - monitor-server
    restart: unless-stopped

  # Example Agent - Web Server
  # agent-web:
  #   build: ./agent
  #   container_name: monitor-agent-web
  #   environment:
  #     - AGENT_NAME=docker-web-01
  #     - SERVER_URL=http://monitor-server:8080
  #     - COLLECTION_INTERVAL=15
  #     # Uncomment and set your API key if authentication is required
  #     # - API_KEY=msk_your_api_key_here
  #   networks:
  #     - monitoring
  #   depends_on:
  #     - monitor-server
  #   restart: unless-stopped

  # Example Agent - API Server
  # agent-api:
  #   build: ./agent
  #   container_name: monitor-agent-api
  #   environment:
  #     - AGENT_NAME=docker-api-01
  #     - SERVER_URL=http://monitor-server:8080
  #     - COLLECTION_INTERVAL=15
  #     # Uncomment and set your API key if authentication is required
  #     # - API_KEY=msk_your_api_key_here
  #   networks:
  #     - monitoring
  #   depends_on:
  #     - monitor-server
  #   restart: unless-stopped

  # # Example Agent - Database Server
  # agent-db:
  #   build: ./agent
  #   container_name: monitor-agent-db
  #   environment:
  #     - AGENT_NAME=docker-db-01
  #     - SERVER_URL=http://monitor-server:8080
  #     - COLLECTION_INTERVAL=15
  #     # Uncomment and set your API key if authentication is required
  #     # - API_KEY=msk_your_api_key_here
  #   networks:
  #     - monitoring
  #   depends_on:
  #     - monitor-server
  #   restart: unless-stopped

networks:
  monitoring:
    driver: bridge

volumes:
  postgres_data:
    driver: local
