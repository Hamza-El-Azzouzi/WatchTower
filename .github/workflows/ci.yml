name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test-server:
    name: Test Server
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust toolchain
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: stable
    
    - name: Cache cargo registry
      uses: actions/cache@v3
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
    
    - name: Cache cargo index
      uses: actions/cache@v3
      with:
        path: ~/.cargo/git
        key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
    
    - name: Cache cargo build
      uses: actions/cache@v3
      with:
        path: server/target
        key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}
    
    - name: Run tests
      working-directory: ./server
      run: cargo test --verbose
    
    - name: Run clippy
      working-directory: ./server
      run: cargo clippy -- -D warnings
    
    - name: Check formatting
      working-directory: ./server
      run: cargo fmt -- --check

  test-agent:
    name: Test Agent
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust toolchain
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: stable
    
    - name: Cache cargo
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          agent/target
        key: ${{ runner.os }}-cargo-agent-${{ hashFiles('**/Cargo.lock') }}
    
    - name: Run tests
      working-directory: ./agent
      run: cargo test --verbose
    
    - name: Run clippy
      working-directory: ./agent
      run: cargo clippy -- -D warnings

  test-dashboard:
    name: Test Dashboard
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: dev-ops-monitoring-dashboard/package-lock.json
    
    - name: Install dependencies
      working-directory: ./dev-ops-monitoring-dashboard
      run: npm ci
    
    - name: Run linter
      working-directory: ./dev-ops-monitoring-dashboard
      run: npm run lint || true
    
    - name: Build
      working-directory: ./dev-ops-monitoring-dashboard
      run: npm run build

  build-docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [test-server, test-agent, test-dashboard]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build server image
      uses: docker/build-push-action@v5
      with:
        context: ./server
        push: false
        tags: devops-monitor-server:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
    
    - name: Build agent image
      uses: docker/build-push-action@v5
      with:
        context: ./agent
        push: false
        tags: devops-monitor-agent:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
    
    - name: Build dashboard image
      uses: docker/build-push-action@v5
      with:
        context: ./dev-ops-monitoring-dashboard
        push: false
        tags: devops-monitor-dashboard:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build-docker
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Start services with docker-compose
      run: docker-compose up -d
    
    - name: Wait for services to be ready
      run: |
        timeout 60 bash -c 'until curl -f http://localhost:8080/health; do sleep 2; done'
    
    - name: Test API health
      run: |
        curl -f http://localhost:8080/health
        curl -f http://localhost:8080/api/v1/agents
    
    - name: Test metrics ingestion
      run: |
        curl -X POST http://localhost:8080/api/v1/metrics \
          -H "Content-Type: application/json" \
          -d '{"agent_id": "ci-test", "metrics": [{"name": "cpu", "value": 50.0, "timestamp": "2026-01-28T10:00:00Z"}]}'
    
    - name: Show logs on failure
      if: failure()
      run: docker-compose logs
    
    - name: Cleanup
      if: always()
      run: docker-compose down -v

  benchmark:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust toolchain
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: stable
    
    - name: Run benchmarks
      working-directory: ./server
      run: cargo bench --no-fail-fast
    
    - name: Archive benchmark results
      uses: actions/upload-artifact@v4
      with:
        name: benchmark-results
        path: server/target/criterion/
