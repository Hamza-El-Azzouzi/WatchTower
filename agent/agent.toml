[agent]
name = "dev-server-01"

[collection]
interval_seconds = 15

[delivery]
directory = "./agent-spool"
max_bytes = 268435456
max_records = 100000
replay_interval_ms = 100

[metrics]
collect_cpu = true
collect_memory = true
collect_disk = true
collect_network = true

# Opt-in process watch. Names are matched exactly (case-insensitive); command
# lines and environment variables are never collected.
[process_watch]
enabled = false
names = ["postgres", "nginx"]

[service_watch]
enabled = true
names = ["watchtower-agent", "docker", "ssh"]
interval_seconds = 15

# Disabled until a loopback-only, GET-only Docker telemetry endpoint is
# deliberately configured. Never expose the Docker API on a public interface.
[docker_monitor]
enabled = false
endpoint = "file:///run/watchtower/docker-telemetry.json"
interval_seconds = 15

[server]
enabled = true
url = "https://api.monitor.example.com"
api_key = "msk_REPLACE_ME"  # Get from the WatchTower admin dashboard
retry_attempts = 3
retry_delay_seconds = 2

[database]
enabled = true
interval_seconds = 15
db_type = "postgres"
host = "localhost"
port = 5432
database = "monitoring"
username = "monitoring_user"
password = "REPLACE_ME"
