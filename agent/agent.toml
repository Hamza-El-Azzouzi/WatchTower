[agent]
name = "dev-server-01"

[collection]
interval_seconds = 15

[metrics]
collect_cpu = true
collect_memory = true
collect_disk = true
collect_network = true

# Opt-in process watch. Names are matched exactly (case-insensitive); command
# lines and environment variables are never collected.
[process_watch]
enabled = false
names = ["postgres", "nginx"]

[server]
enabled = true
url = "http://10.1.17.1:8080"
api_key = "msk_REPLACE_ME"  # Get from the WatchTower admin dashboard
retry_attempts = 3
retry_delay_seconds = 2

[database]
enabled = true
db_type = "postgres"
host = "localhost"
port = 5432
database = "monitoring"
username = "monitoring_user"
password = "REPLACE_ME"
