version: '3.8'

services:
  agent-web:
    build: .
    container_name: agent-web-01
    environment:
      - AGENT_NAME=docker-web-01
      - SERVER_URL=http://10.1.5.1:8080
      - COLLECTION_INTERVAL=15
    restart: unless-stopped

  agent-api:
    build: .
    container_name: agent-api-01
    environment:
      - AGENT_NAME=docker-api-01
      - SERVER_URL=http://10.1.5.1:8080
      - COLLECTION_INTERVAL=15
    restart: unless-stopped

  agent-db:
    build: .
    container_name: agent-db-01
    environment:
      - AGENT_NAME=docker-db-01
      - SERVER_URL=http://10.1.5.1:8080
      - COLLECTION_INTERVAL=15
    restart: unless-stopped
