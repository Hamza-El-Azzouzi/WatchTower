[agent]
name = "db-monitor-01"

[collection]
interval_seconds = 15

[metrics]
collect_cpu = true
collect_memory = true
collect_disk = true
collect_network = true

[server]
enabled = true
url = "http://localhost:8080"
retry_attempts = 3
retry_delay_seconds = 2

[database]
enabled = true
db_type = "postgres"
host = "localhost"
port = 5432
database = "testdb"
username = "postgres"
password = "postgres"
